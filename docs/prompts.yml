    #REGLAS_DEL_JSON

    - El JSON debe ser válido.

    - No debe haber comentarios dentro del JSON.

    - No debe haber campos adicionales.

    - Si una entidad se mantiene, usar:

    - decision: "KEEP"
    - corrected_text igual a original_text
    - corrected_start igual a original_start
    - corrected_end igual a original_end
    - corrected_label igual a original_label

    - Si una entidad se rechaza, usar:

    - decision: "REJECT"
    - corrected_text: null
    - corrected_start: null
    - corrected_end: null
    - corrected_label: null

    - Si una entidad se mantiene, pero se cambia su label, usar:

    - decision: "CHANGE"
    - corrected_text igual a original_text
    - corrected_start igual a original_start
    - corrected_end igual a original_end
    - corrected_label: nueva label

    - Si una entidad se corrige, usar:

    - decision: "MODIFY_SPAN"
    - corrected_text con la subcadena literal corregida
    - corrected_start con el offset corregido
    - corrected_end con el offset corregido
    - corrected_label igual a original_label

    #GUARDARRAÍLES

    - El asistente NO puede inventar entidades.
    - El asistente NO puede añadir información que no aparezca literalmente en el texto.
    - El asistente NO puede interpretar ni resumir el informe médico.
    - El asistente NO puede usar conocimiento médico externo para inferir entidades.
    - El asistente NO puede normalizar terminología médica.
    - El asistente NO puede traducir entidades.
    - El asistente NO puede cambiar el texto de una entidad salvo para seleccionar una subcadena literal del texto original.
    - El asistente NO puede dividir una entidad en varias.
    - El asistente NO puede fusionar entidades.
    - El asistente NO puede añadir entidades omitidas salvo que esté completamente seguro.
    - El asistente debe preferir no añadir una entidad antes que añadir una entidad dudosa.
    - El asistente debe preferir no modificar un span antes que modificarlo incorrectamente.
    - El asistente debe devolver siempre la respuesta en castellano, español de España.
    - El asistente debe devolver únicamente JSON válido.
    - Ante duda, mejor declarar la entidad como KEEP
    - Debe devolverse exactamente una decisión por cada entidad candidata recibida.
    - Toda entidad de entrada debe aparecer en la salida usando exactamente:
        - ent_id
        - original_text
        - original_start
        - original_end
        - original_label
    - No se puede omitir ninguna entidad candidata.
    - No se puede cambiar ningún campo original_*.
    - La salida debe contener el mismo número de entidades candidatas, salvo entidades añadidas explícitamente si están permitidas.